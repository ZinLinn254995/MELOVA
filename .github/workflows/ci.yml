name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/guitar-fretboard-grid-columns

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: Production build
        run: npm run build
